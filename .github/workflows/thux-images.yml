# Thux-CODE fork only: never part of a pull request upstream.
#
# Builds the helper images an incus-compose binary from thux-1.4 points at
# (cmd/incus-compose: DefaultHealthdImage, DefaultDNSImage, defaultSleepImage,
# all ghcr.io/thux-code/incus-compose/<image>:{version}) and pushes them with
# the version the binary is built with, plus the short commit sha.
#
# The tag must stay a legal OCI tag: no "+". Bump it together with the
# version the binary is built with (-X .../version.Version=<tag>).
name: thux images

on:
  push:
    branches:
      - thux-1.4
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ic-healthd, ic-sleep, ic-dns]
    steps:
      - uses: actions/checkout@v7

      - name: tags
        id: tags
        run: |
          case "${GITHUB_REF_NAME}" in
            thux-1.4) tag=1.4.0-thux.2 ;;
            *) echo "no image tag for branch ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/incus-compose/${{ matrix.image }}"
          sha="${GITHUB_SHA::7}"
          {
            echo "version=${tag}"
            echo "tags=${image}:${tag},${image}:${tag}-${sha}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.2.0

      - name: ghcr-login
        uses: docker/login-action@v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: container/${{ matrix.image }}/Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=${{ matrix.image }} (Thux-CODE build of ${{ github.ref_name }})
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
